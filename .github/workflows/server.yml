name: server

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]

defaults:
  run:
    working-directory: server

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Each integration test starts its own containers; cap how many run at
      # once so the timing assertions (2s query cancel, 3s request timeout)
      # aren't fighting container startup for CPU.
      - run: cargo test --locked -- --test-threads=4

  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t gh-server .
      - name: Binary is static, image is under 25MB
        run: |
          docker create --name out gh-server
          docker cp out:/gh-server ./gh-server
          file gh-server
          if readelf -d gh-server | grep -q NEEDED; then
            echo "binary links against shared libraries"; exit 1
          fi
          size=$(docker image inspect gh-server --format '{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -lt 26214400
