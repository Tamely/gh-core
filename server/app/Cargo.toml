[package]
name = "gh-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
fred = { version = "10.1.0", default-features = false, features = ["i-pubsub", "i-scripts", "subscriber-client"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
mimalloc = "0.1.52"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["timeout", "request-id", "trace", "compression-gzip", "util", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false }
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
