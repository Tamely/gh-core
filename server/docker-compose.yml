# Local Postgres and Redis for development: docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gh
      POSTGRES_PASSWORD: gh
      POSTGRES_DB: gh
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gh"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

volumes:
  pgdata:
