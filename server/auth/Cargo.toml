[package]
name = "auth"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
# Kenny's server uses fred too, so the server has one Redis client, shared with auth.
fred = { version = "10", features = ["i-scripts"] }
# OS randomness for sign-in codes (already in the tree through ed25519-dalek).
getrandom = "0.2"
# HMAC for judge placard tokens (already in the tree through sqlx's Postgres auth).
hmac = "0.12"
# QR codes for the placards, as SVG (judge-admin only).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Postmark and Twilio calls. 0.12 with rustls + webpki roots: the CA list is built in,
# so it works in Kenny's FROM scratch image (0.13 reads the system's CAs, which that image lacks).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
# "migrate" and "macros" are for auth-dev, which runs migrations the same way the server will.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
# "time" for the background revocation retry; the rest for auth-dev.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[dev-dependencies]
# Independent JWT library, used only to prove other software can verify our tokens.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
tower = { version = "0.5", features = ["util"] }
